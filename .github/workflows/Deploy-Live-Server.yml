name: Deploy-Live-Server

on:
  push:
    branches: [ "release" ]
  pull_request:
    branches: [ "release" ]

jobs:
  test-API:
    name: Test API
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          pip install -r requirements.txt
          pip install pytest-cov
      
      - name: Copy existing database for tests
        run: |
          echo "Setting up test database..."
          mkdir -p app
          cp app/testdatabase.db app/test_mobypark.db || echo "No database file to copy"
          echo "Database copied successfully"
      
      - name: Verify API can start
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./app/test_mobypark.db
        run: |
          echo "Verifying API starts correctly..."
          timeout 10s python -m app.main || echo "API started successfully"
      
      - name: Run tests with coverage
        id: run-tests
        # makes the pipeline not stop on failing tests
        # continue-on-error: true
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./app/test_mobypark.db
        run: |
          echo "Running tests with coverage..."
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html --junit-xml=test-results.xml
      
      - name: Surface failing tests
        if: always()
        uses: pmeier/pytest-results-action@main
        with:
          path: test-results.xml
          summary: true
          display-options: fEX
          fail-on-empty: true
          title: Test Results
      
      - name: Upload coverage report (XML)
        if: failure() || success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-xml
          path: coverage.xml
      
      - name: Upload coverage report (HTML)
        if: failure() || success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: htmlcov/
      
      - name: Log test results
        # makes the pipeline not stop on failing tests
        # continue-on-error: true
        if: always()
        run: |
          echo "================================"
          if [ "${{ steps.run-tests.outcome }}" == "success" ]; then
            echo "✅ All tests passed!"
          else
            echo "❌ Tests failed!"
            exit 1
          fi
          echo "================================"
          
      - name: Deploy to server via SSH
        env:
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          echo "Starting deployment..."
          
          # Setup SSH
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          
          echo "Copying files to server..."
          rsync -avz \
            --exclude '.git' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.pytest_cache' \
            --exclude 'venv' \
            --exclude '.venv' \
            --exclude '.env' \
            --exclude 'app/test_mobypark.db' \
            --exclude 'app/database.db' \
            --exclude 'htmlcov' \
            --exclude 'coverage.xml' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}
          
          echo "Installing dependencies and restarting service..."
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "bash -s" <<ENDSSH
      set -e
      cd $SERVER_PATH
      
      echo "Setting up virtual environment..."
      python3 -m venv venv
      source venv/bin/activate
      pip install --upgrade pip
      pip install -r requirements.txt
      
      echo "Restarting service..."
      sudo systemctl restart mobypark-api
      
      echo "Deployment complete!"
      ENDSSH
